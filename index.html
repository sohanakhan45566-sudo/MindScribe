<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8"/>
        <meta name="viewport"
        content="width=device-width, initial-scale=1.0"/>
        <title>MindScribe - AI Note Pad</title>
        <link rel="stylesheet" href="style.css"/>
    </head>
    <body>
        <div class="container">
            <header>
                <h1>MindScribe</h1>
                <button id="theme-toggle">🌙</button>
            </header>

            <main>
                <textarea id="note" placeholder="Start writing your thoughts..."></textarea>
            </main>

            <div class="actions">
                <button id="save-btn">💾 Save</button>
                <button id="clear-btn">🗑️ Clear</button>
                <button id="ai-btn">🤖 AI Assist</button>
            </div>

            <footer>
                <p>Made with by SA</p>
            </footer>
        </div>

        <script src="script.js"></script>
    </body>
</html>
